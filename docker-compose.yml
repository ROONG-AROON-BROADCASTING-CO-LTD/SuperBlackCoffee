services:
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5175}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    ports: ['5175:5175']
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://superblackcoffee.co.th}
    restart: unless-stopped
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports: ['5174:8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  franchise:
    build:
      context: .
      dockerfile: apps/franchise/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports: ['5176:8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  attendance:
    build:
      context: .
      dockerfile: apps/attendance/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports: ['5177:8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  stock:
    build:
      context: .
      dockerfile: apps/stock/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports: ['5178:8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  api:
    build: ./apps/api
    ports: ['8080:8080']
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  redis:
    container_name: superblackcoffee-redis
    image: redis:7-alpine
    ports: ['6379:6379']
    command: redis-server --appendonly yes
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  database:
    container_name: superblackcoffee-postgresql
    image: postgres:17-alpine
    ports: ['5433:5432']
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ['database_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  database-test:
    container_name: superblackcoffee-postgresql-test
    image: postgres:17-alpine
    profiles: ['test']
    ports: ['5434:5432']
    environment:
      POSTGRES_DB: test_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d test_app']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: 'no'

volumes:
  database_data:
  redis_data:
