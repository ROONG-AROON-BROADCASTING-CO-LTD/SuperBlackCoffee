name: CI

on: [push, pull_request]

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:website
      - run: pnpm run build:website

  admin:
    name: Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:admin
      - run: pnpm run build:admin

  franchise:
    name: Franchise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:franchise
      - run: pnpm run build:franchise

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go test ./...
        working-directory: apps/api
      - run: docker compose --profile test up -d --wait database-test
      - run: TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5434/test_app go test -count=1 -p 1 ./...
        working-directory: apps/api
      - run: docker rm -f superblackcoffee-postgresql-test || true
        if: always()
      - run: go build ./cmd/api
        working-directory: apps/api
