services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      API_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the cloud secret store}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in the cloud secret store}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the cloud secret store}
      CORS_ORIGINS: ${CORS_ORIGINS:?set the HTTPS frontend origins}
    expose: ['8080']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set the public API URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set the website URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    environment:
      PORT: 5175
    expose: ['5175']
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set the public API URL with /api/v1}
    expose: ['8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  franchise:
    build:
      context: .
      dockerfile: apps/franchise/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set the public API URL with /api/v1}
    expose: ['8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  attendance:
    build:
      context: .
      dockerfile: apps/attendance/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set the public API URL with /api/v1}
    expose: ['8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  stock:
    build:
      context: .
      dockerfile: apps/stock/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set the public API URL with /api/v1}
    expose: ['8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
